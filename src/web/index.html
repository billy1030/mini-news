<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-News Financial Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Default: Clean Financial Light Theme */
    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.8);
      --header-bg: rgba(255, 255, 255, 0.8);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --code-bg: #f1f5f9;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    /* Dark Mode (Toggleable) */
    [data-theme="dark"] {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --header-bg: rgba(9, 13, 22, 0.8);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --success: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: rgba(0, 0, 0, 0.4);
      --code-bg: #050811;
      --shadow-sm: none;
      --shadow-md: 0 4px 20px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(22, 163, 74, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      padding: 1.1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .brand span { font-size: 0.75rem; color: var(--accent); background: rgba(37, 99, 235, 0.1); padding: 2px 8px; border-radius: 9999px; margin-left: 6px; font-weight: 500; }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }

    .btn-outline {
      background: var(--card-bg);
      border-color: var(--card-border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .btn-outline:hover { background: var(--code-bg); }

    .btn-refresh {
      min-width: 105px;
      justify-content: center;
    }

    .btn-refresh .icon {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .btn-refresh.loading .icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-item {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; }
    .stat-val { font-size: 1.25rem; font-weight: 700; color: var(--text-main); font-family: var(--font-mono); }

    .setting-group {
      margin-bottom: 1.25rem;
    }
    .setting-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: block;
    }
    .setting-input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      box-shadow: var(--shadow-sm);
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .news-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .news-card.alert {
      border-left: 4px solid var(--danger);
      background: var(--danger-bg);
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tag-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.7rem;
    }
    .tag-up { background: rgba(22, 163, 74, 0.15); color: var(--success); }
    .tag-down { background: rgba(220, 38, 38, 0.15); color: var(--danger); }
    .tag-flat { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); }
    .tag-alert { background: rgba(220, 38, 38, 0.2); color: var(--danger); }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .filter-pills-group {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-pills-group::-webkit-scrollbar {
      display: none;
    }

    .filter-controls-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-shrink: 0;
    }

    .filter-pill {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filter-pill:hover {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .filter-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    .filter-count {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.08);
    }
    .filter-pill.active .filter-count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 1.25rem 0 0.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--code-bg);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      color: var(--text-main);
    }
    .group-header.group-up { border-left-color: var(--success); }
    .group-header.group-down { border-left-color: var(--danger); }
    .group-header.group-flat { border-left-color: var(--text-muted); }

    .news-body {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .sql-editor {
      width: 100%;
      height: 100px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      resize: vertical;
    }

    .sql-result {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-main);
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">MN</div>
      <div>
        <h1>Mini-News Control Center <span>MCP ACTIVE</span></h1>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" id="btn-theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
      <button class="btn btn-primary" id="btn-poll-now">⚡ Fetch Live Now</button>
      <button class="btn btn-outline btn-refresh" id="btn-refresh" onclick="loadAllData()">
        <span class="icon">🔄</span>
        <span class="btn-text">Refresh</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Settings & SQL Playground -->
    <aside>
      <div class="card">
        <div class="card-title">System Metrics</div>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="stat-label">Stored Flashes</div>
            <div class="stat-val" id="stat-total">--</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Dashboard Port</div>
            <div class="stat-val" id="stat-port">5200</div>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label">Database URL (Host: 5232 / Zeabur)</label>
          <input type="text" class="setting-input" id="cfg-db" readonly />
        </div>

        <div class="setting-group">
          <label class="setting-label">Poll Frequency (Seconds)</label>
          <input type="number" class="setting-input" id="cfg-interval" value="60" readonly />
        </div>

        <div class="setting-group">
          <label class="setting-label">Data Source Endpoint</label>
          <input type="text" class="setting-input" id="cfg-source" readonly />
        </div>
      </div>

      <!-- SQL Playground Card -->
      <div class="card">
        <div class="card-title">Safe SQL Playground</div>
        <textarea class="sql-editor" id="sql-input">SELECT time_hkt, raw_content, direction FROM flash_news ORDER BY created_at DESC LIMIT 5;</textarea>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 0.75rem;" onclick="runSql()">Run Safe Query</button>
        <div class="sql-result" id="sql-output">// Query results will appear here...</div>
      </div>
    </aside>

    <!-- Right Section: Real-time Live News Feed -->
    <section>
      <div class="card">
        <div class="card-title">
          <span>7x24 Live Financial Stream (HKT)</span>
          <span style="font-size: 0.75rem; color: var(--text-muted);" id="feed-status">Auto-refreshed</span>
        </div>

        <!-- Filter & Grouping Controls -->
        <div class="filter-bar">
          <div class="filter-pills-group">
            <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-right: 0.25rem; white-space: nowrap;">FILTER:</span>
            <div class="filter-pill active" data-filter="ALL" onclick="setFilter('ALL')">
              <span>All</span> <span class="filter-count" id="count-all">0</span>
            </div>
            <div class="filter-pill" data-filter="ALERT" onclick="setFilter('ALERT')">
              <span>🔥 Alert</span> <span class="filter-count" id="count-alert">0</span>
            </div>
            <div class="filter-pill" data-filter="UP" onclick="setFilter('UP')">
              <span>🟢 UP</span> <span class="filter-count" id="count-up">0</span>
            </div>
            <div class="filter-pill" data-filter="DOWN" onclick="setFilter('DOWN')">
              <span>🔴 DOWN</span> <span class="filter-count" id="count-down">0</span>
            </div>
            <div class="filter-pill" data-filter="FLAT" onclick="setFilter('FLAT')">
              <span>⚪ FLAT</span> <span class="filter-count" id="count-flat">0</span>
            </div>
          </div>

          <div class="filter-controls-group">
            <label style="font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.35rem; cursor: pointer; white-space: nowrap;">
              <input type="checkbox" id="chk-group-flag" onchange="toggleGrouping()" />
              <span>Group by Flag</span>
            </label>
            <select id="sel-sort" onchange="changeSorting()" style="padding: 0.3rem 0.5rem; font-size: 0.75rem; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 6px;">
              <option value="time-desc">Newest First</option>
              <option value="time-asc">Oldest First</option>
              <option value="flag">Sort by Flag (UP > ALERT > DOWN > FLAT)</option>
            </select>
          </div>
        </div>

        <div class="news-list" id="news-container">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading live news stream...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Theme Toggle Functionality
    function initTheme() {
      const savedTheme = localStorage.getItem('mini_news_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('mini_news_theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) {
        btn.innerText = theme === 'light' ? '🌙 Dark' : '☀️ Light';
      }
    }

    initTheme();

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('stat-total').innerText = data.totalRecords || '0';
        document.getElementById('stat-port').innerText = data.port || '5200';
        document.getElementById('cfg-db').value = data.dbUrl || '';
        document.getElementById('cfg-interval').value = data.pollInterval || 60;
        document.getElementById('cfg-source').value = data.sourceUrl || '';
      } catch (err) {
        console.error('Failed to load status:', err);
      }
    }

    // News state & filter configuration
    let rawNewsItems = [];
    let currentFilter = 'ALL';
    let isGrouped = false;
    let currentSort = 'time-desc';

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.classList.toggle('active', pill.getAttribute('data-filter') === filter);
      });
      renderNews();
    }

    function toggleGrouping() {
      isGrouped = document.getElementById('chk-group-flag').checked;
      renderNews();
    }

    function changeSorting() {
      currentSort = document.getElementById('sel-sort').value;
      renderNews();
    }

    function updateCounts(items) {
      let up = 0, down = 0, flat = 0, alert = 0;
      items.forEach(item => {
        if (item.isAlert || item.importance >= 2) alert++;
        if (item.direction === 'UP') up++;
        else if (item.direction === 'DOWN') down++;
        else flat++;
      });
      document.getElementById('count-all').innerText = items.length;
      document.getElementById('count-alert').innerText = alert;
      document.getElementById('count-up').innerText = up;
      document.getElementById('count-down').innerText = down;
      document.getElementById('count-flat').innerText = flat;
    }

    function sortNews(items) {
      const copy = [...items];
      if (currentSort === 'time-asc') {
        return copy.sort((a, b) => new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime());
      }
      if (currentSort === 'flag') {
        const flagRank = (item) => {
          if (item.isAlert || item.importance >= 2) return 1;
          if (item.direction === 'UP') return 2;
          if (item.direction === 'DOWN') return 3;
          return 4; // FLAT
        };
        return copy.sort((a, b) => flagRank(a) - flagRank(b) || new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
      }
      // default: time-desc
      return copy.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
    }

    function renderCard(item) {
      const isAlert = item.isAlert || item.importance >= 2;
      const dirClass = item.direction === 'UP' ? 'tag-up' : item.direction === 'DOWN' ? 'tag-down' : 'tag-flat';
      const tickerBadges = (item.tickers && item.tickers.length > 0)
        ? item.tickers.map(t => `<span class="tag-badge" style="background: rgba(37,99,235,0.1); color: var(--accent);">${t}</span>`).join(' ')
        : '';
      return `
        <div class="news-card ${isAlert ? 'alert' : ''}">
          <div class="news-meta">
            <span style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">${item.timeHkt || ''}</span>
            <span>${item.dateHkt || ''}</span>
            ${item.direction ? `<span class="tag-badge ${dirClass}">${item.direction}</span>` : ''}
            ${isAlert ? `<span class="tag-badge tag-alert">ALERT 🔥</span>` : ''}
            ${tickerBadges}
            <span>ID: ${item.id}</span>
          </div>
          <div class="news-body">${item.rawContent}</div>
        </div>
      `;
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      if (!rawNewsItems || rawNewsItems.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No news items found. Click "Fetch Live Now" above.</div>';
        return;
      }

      // Filter items
      let filtered = rawNewsItems.filter(item => {
        const isAlert = item.isAlert || item.importance >= 2;
        if (currentFilter === 'ALL') return true;
        if (currentFilter === 'ALERT') return isAlert;
        if (currentFilter === 'UP') return item.direction === 'UP';
        if (currentFilter === 'DOWN') return item.direction === 'DOWN';
        if (currentFilter === 'FLAT') return item.direction === 'FLAT' || !item.direction;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 3rem;">No news matching "${currentFilter}" filter.</div>`;
        return;
      }

      // If Group by Flag is selected
      if (isGrouped) {
        const groups = [
          { name: '🔥 High Priority / Alert News', key: 'ALERT', class: 'group-down', items: filtered.filter(i => i.isAlert || i.importance >= 2) },
          { name: '🟢 Bullish (UP) Sentiment', key: 'UP', class: 'group-up', items: filtered.filter(i => i.direction === 'UP' && !(i.isAlert || i.importance >= 2)) },
          { name: '🔴 Bearish (DOWN) Sentiment', key: 'DOWN', class: 'group-down', items: filtered.filter(i => i.direction === 'DOWN' && !(i.isAlert || i.importance >= 2)) },
          { name: '⚪ Neutral / General (FLAT)', key: 'FLAT', class: 'group-flat', items: filtered.filter(i => (i.direction === 'FLAT' || !i.direction) && !(i.isAlert || i.importance >= 2)) }
        ];

        let html = '';
        groups.forEach(g => {
          if (g.items.length > 0) {
            const sortedItems = sortNews(g.items);
            html += `<div class="group-header ${g.class}">${g.name} (${g.items.length})</div>`;
            html += sortedItems.map(renderCard).join('');
          }
        });
        container.innerHTML = html;
        return;
      }

      // Plain sorted list
      const sorted = sortNews(filtered);
      container.innerHTML = sorted.map(renderCard).join('');
    }

    async function loadNews() {
      try {
        const res = await fetch('/api/news?limit=50');
        const items = await res.json();
        rawNewsItems = items || [];
        updateCounts(rawNewsItems);
        renderNews();
      } catch (err) {
        console.error('Failed to load news:', err);
      }
    }

    async function runSql() {
      const sql = document.getElementById('sql-input').value;
      const output = document.getElementById('sql-output');
      output.innerText = 'Executing safe query...';
      try {
        const res = await fetch('/api/sql', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql })
        });
        const result = await res.json();
        if (result.error) {
          output.innerText = '❌ Error: ' + result.error;
        } else {
          output.innerText = JSON.stringify(result.rows, null, 2);
        }
      } catch (err) {
        output.innerText = '❌ Request failed: ' + err.message;
      }
    }

    document.getElementById('btn-poll-now').addEventListener('click', async () => {
      const btn = document.getElementById('btn-poll-now');
      btn.innerText = 'Fetching...';
      btn.disabled = true;
      try {
        await fetch('/api/poll', { method: 'POST' });
        await loadAllData();
      } finally {
        btn.innerText = '⚡ Fetch Live Now';
        btn.disabled = false;
      }
    });

    async function loadAllData() {
      const btnRefresh = document.getElementById('btn-refresh');
      const feedStatus = document.getElementById('feed-status');
      if (btnRefresh) {
        btnRefresh.classList.add('loading');
      }
      try {
        await Promise.all([loadStatus(), loadNews()]);
        if (feedStatus) {
          const now = new Date().toLocaleTimeString();
          feedStatus.innerText = `Updated at ${now}`;
        }
      } finally {
        if (btnRefresh) {
          btnRefresh.classList.remove('loading');
        }
      }
    }

    loadAllData();
    // Auto refresh feed every 30s
    setInterval(loadAllData, 30000);
  </script>
</body>
</html>
