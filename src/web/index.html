<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-News Financial Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .brand span { font-size: 0.75rem; color: var(--accent); background: rgba(59, 130, 246, 0.15); padding: 2px 8px; border-radius: 9999px; margin-left: 6px; }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text-main);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; }
    .stat-val { font-size: 1.25rem; font-weight: 700; color: #fff; font-family: var(--font-mono); }

    .setting-group {
      margin-bottom: 1.25rem;
    }
    .setting-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: block;
    }
    .setting-input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .news-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s ease;
      position: relative;
    }
    .news-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      background: rgba(255, 255, 255, 0.04);
    }

    .news-card.alert {
      border-left: 4px solid var(--danger);
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tag-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.7rem;
    }
    .tag-up { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .tag-down { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .tag-flat { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .tag-alert { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .news-body {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .sql-editor {
      width: 100%;
      height: 100px;
      background: #050811;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      resize: vertical;
    }

    .sql-result {
      background: #050811;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #a5f3fc;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">MN</div>
      <div>
        <h1>Mini-News Control Center <span>MCP ACTIVE</span></h1>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="btn-poll-now">⚡ Fetch Live Now</button>
      <button class="btn btn-outline" onclick="loadAllData()">🔄 Refresh</button>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Settings & SQL Playground -->
    <aside>
      <div class="card">
        <div class="card-title">System Metrics</div>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="stat-label">Stored Flashes</div>
            <div class="stat-val" id="stat-total">--</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Dashboard Port</div>
            <div class="stat-val" id="stat-port">5200</div>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label">Database URL (Host: 5232 / Zeabur)</label>
          <input type="text" class="setting-input" id="cfg-db" readonly />
        </div>

        <div class="setting-group">
          <label class="setting-label">Poll Frequency (Seconds)</label>
          <input type="number" class="setting-input" id="cfg-interval" value="60" readonly />
        </div>

        <div class="setting-group">
          <label class="setting-label">Data Source Endpoint</label>
          <input type="text" class="setting-input" id="cfg-source" readonly />
        </div>
      </div>

      <!-- SQL Playground Card -->
      <div class="card">
        <div class="card-title">Safe SQL Playground</div>
        <textarea class="sql-editor" id="sql-input">SELECT time_hkt, raw_content, direction FROM flash_news ORDER BY created_at DESC LIMIT 5;</textarea>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 0.75rem;" onclick="runSql()">Run Safe Query</button>
        <div class="sql-result" id="sql-output">// Query results will appear here...</div>
      </div>
    </aside>

    <!-- Right Section: Real-time Live News Feed -->
    <section>
      <div class="card">
        <div class="card-title">
          <span>7x24 Live Financial Stream (HKT)</span>
          <span style="font-size: 0.75rem; color: var(--text-muted);" id="feed-status">Auto-refreshed</span>
        </div>
        <div class="news-list" id="news-container">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading live news stream...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('stat-total').innerText = data.totalRecords || '0';
        document.getElementById('stat-port').innerText = data.port || '5200';
        document.getElementById('cfg-db').value = data.dbUrl || '';
        document.getElementById('cfg-interval').value = data.pollInterval || 60;
        document.getElementById('cfg-source').value = data.sourceUrl || '';
      } catch (err) {
        console.error('Failed to load status:', err);
      }
    }

    async function loadNews() {
      try {
        const res = await fetch('/api/news?limit=30');
        const items = await res.json();
        const container = document.getElementById('news-container');
        if (!items || items.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No news items found. Click "Fetch Live Now" above.</div>';
          return;
        }

        container.innerHTML = items.map(item => {
          const isAlert = item.isAlert || item.importance >= 2;
          const dirClass = item.direction === 'UP' ? 'tag-up' : item.direction === 'DOWN' ? 'tag-down' : 'tag-flat';
          return `
            <div class="news-card ${isAlert ? 'alert' : ''}">
              <div class="news-meta">
                <span style="font-family: var(--font-mono); font-weight: 600; color: #38bdf8;">${item.timeHkt}</span>
                <span>${item.dateHkt}</span>
                ${item.direction ? `<span class="tag-badge ${dirClass}">${item.direction}</span>` : ''}
                ${isAlert ? `<span class="tag-badge tag-alert">ALERT 🔥</span>` : ''}
                <span>ID: ${item.id}</span>
              </div>
              <div class="news-body">${item.rawContent}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load news:', err);
      }
    }

    async function runSql() {
      const sql = document.getElementById('sql-input').value;
      const output = document.getElementById('sql-output');
      output.innerText = 'Executing safe query...';
      try {
        const res = await fetch('/api/sql', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql })
        });
        const result = await res.json();
        if (result.error) {
          output.innerText = '❌ Error: ' + result.error;
        } else {
          output.innerText = JSON.stringify(result.rows, null, 2);
        }
      } catch (err) {
        output.innerText = '❌ Request failed: ' + err.message;
      }
    }

    document.getElementById('btn-poll-now').addEventListener('click', async () => {
      const btn = document.getElementById('btn-poll-now');
      btn.innerText = 'Fetching...';
      btn.disabled = true;
      try {
        await fetch('/api/poll', { method: 'POST' });
        await loadAllData();
      } finally {
        btn.innerText = '⚡ Fetch Live Now';
        btn.disabled = false;
      }
    });

    async function loadAllData() {
      await Promise.all([loadStatus(), loadNews()]);
    }

    loadAllData();
    // Auto refresh feed every 30s
    setInterval(loadAllData, 30000);
  </script>
</body>
</html>
