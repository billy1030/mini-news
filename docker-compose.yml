services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mini-news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mini_news
      # Ensure PostgreSQL initializes with UTF-8 encoding
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      # Host port 5232 mapped to internal 5432
      - "5232:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_news"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
